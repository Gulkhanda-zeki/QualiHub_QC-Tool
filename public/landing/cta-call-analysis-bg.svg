      <rect x="130" y="36" width="6" height="92" rx="3"/>
      <rect x="144" y="60" width="6" height="56" rx="3"/>
      <rect x="158" y="28" width="6" height="104" rx="3"/>
      <rect x="172" y="44" width="6" height="80" rx="3"/>
      <rect x="186" y="20" width="6" height="120" rx="3"/>
      <rect x="200" y="48" width="6" height="72" rx="3"/>
      <rect x="214" y="32" width="6" height="96" rx="3"/>
      <rect x="228" y="56" width="6" height="64" rx="3"/>
      <rect x="242" y="40" width="6" height="88" rx="3"/>
      <rect x="256" y="24" width="6" height="112" rx="3"/>
      <rect x="270" y="52" width="6" height="68" rx="3"/>
