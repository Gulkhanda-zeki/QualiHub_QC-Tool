<svg width="1380" height="600" viewBox="0 0 1380 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cta-bg" x1="1639.75" y1="1160" x2="110.495" y2="-326.239" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="0.5" stop-color="#FFD54F"/>
      <stop offset="0.75" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="wave-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E408A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="node-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1380" height="600" fill="url(#cta-bg)"/>
  <rect x="0.5" y="0.5" width="1379" height="599" stroke="#1F1C1B" stroke-opacity="0.04"/>

  <!-- ambient glow -->
  <ellipse cx="980" cy="320" rx="280" ry="180" fill="#3B82F6" opacity="0.12" filter="url(#soft-blur)"/>
  <ellipse cx="180" cy="480" rx="220" ry="140" fill="#0A0A0A" opacity="0.35" filter="url(#soft-blur)"/>

  <!-- diarization lanes (left) -->
