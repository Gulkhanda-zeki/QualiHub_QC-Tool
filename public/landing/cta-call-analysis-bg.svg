    <rect x="56" y="524" width="200" height="8" rx="4" fill="#2563EB"/>
    <rect x="264" y="524" width="60" height="8" rx="4" fill="#F87171"/>
  </g>

  <!-- waveform cluster (bottom-left) -->
  <g transform="translate(0, 600) scale(1,-1)" opacity="0.35">
    <rect x="0" y="0" width="420" height="220" fill="url(#wave-fill)"/>
    <g fill="#EFF6FF" opacity="0.85">
      <rect x="32" y="48" width="6" height="72" rx="3"/>
      <rect x="46" y="32" width="6" height="96" rx="3"/>
      <rect x="60" y="56" width="6" height="64" rx="3"/>
      <rect x="74" y="24" width="6" height="112" rx="3"/>
      <rect x="88" y="40" width="6" height="88" rx="3"/>
