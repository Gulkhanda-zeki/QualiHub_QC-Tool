  <path d="M820 480 C860 420, 940 400, 1020 430 C1100 460, 1140 520, 1100 560" stroke="#BFDBFE" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>
  <path d="M860 500 C900 460, 960 450, 1010 470" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.2" fill="none"/>

  <!-- QA score chip (decorative) -->
  <g opacity="0.18" transform="translate(1040, 380)">
    <rect width="120" height="56" rx="14" fill="#EFF6FF"/>
    <rect x="12" y="12" width="48" height="6" rx="3" fill="#2563EB"/>
